<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your data is being harvested. Here's how to take it back. Privacy-respecting alternatives to the tools you use every day.">
  <meta name="robots" content="index, follow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0d1117">
  <title>Digital Privacy Pocket Toolkit</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header>
    <h1>🛡️ Digital Privacy<br>Pocket Toolkit</h1>
    <p class="tagline">Scan. Swap. Share.</p>
    <p class="intro" id="hero-subhead"></p>
    <div class="cta-row">
      <a href="https://github.com/cyphermonk21/privacy-zine" target="_blank" rel="noopener noreferrer" class="btn">📄 Source</a>
      <a href="../dist/privacy-zine-v2.0.0-en.pdf" download class="btn btn-primary">📥 Download PDF</a>
      <a href="https://github.com/cyphermonk21/privacy-zine/issues" target="_blank" rel="noopener noreferrer" class="btn">💬 Suggest a Tool</a>
    </div>
  </header>

  <!-- Stats strip -->
  <section id="stats-strip"></section>

  <!-- Intro questions -->
  <section id="intro" class="grid-2"></section>

  <!-- Encryption explainer -->
  <section id="encryption" class="callout hidden"></section>

  <!-- Difficulty filter -->
  <div id="filter-bar" class="filter-bar hidden">
    <span class="filter-label">Filter by difficulty:</span>
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="easy">⚡ Easy</button>
    <button class="filter-btn" data-filter="medium">🔧 Medium</button>
    <button class="filter-btn" data-filter="advanced">🚀 Advanced</button>
  </div>

  <!-- Tool categories -->
  <nav id="categories"></nav>

  <!-- Reading list -->
  <section id="reading-list" class="hidden"></section>

  <!-- Resources -->
  <section id="resources" class="hidden"></section>

  <footer>
    <p class="small">No cookies. No tracking. No analytics. Just information.</p>
    <p class="small">Content: <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a> · Code: MIT</p>
    <p class="small">Built with <a href="https://penpot.app" target="_blank" rel="noopener noreferrer">Penpot</a> · Hosted on GitHub Pages</p>
    <p class="small">Privacy isn't hiding. It's choosing.</p>
  </footer>

  <script>
    fetch('../src/data/tools.json')
      .then(r => r.json())
      .then(data => {

        /* ---- HERO ---- */
        if (data.intro?.hero) {
          document.getElementById('hero-subhead').textContent = data.intro.hero.subhead;
        }

        /* ---- STATS STRIP ---- */
        if (data.stats) {
          const statsEl = document.getElementById('stats-strip');
          statsEl.innerHTML = data.stats.map(s => `
            <div class="stat-card">
              <span class="stat-value">${s.value}</span>
              <span class="stat-label">${s.label}</span>
              <span class="stat-caption">${s.caption}</span>
            </div>
          `).join('');
        }

        /* ---- INTRO QUESTIONS ---- */
        const introEl = document.getElementById('intro');
        if (data.intro?.questions) {
          introEl.innerHTML = data.intro.questions.map(q => {
            const points = q.points.map(p => `<li>${p}</li>`).join('');
            return `<div class="intro-block">
              <h2>${q.heading}</h2>
              <ul>${points}</ul>
            </div>`;
          }).join('');
        }

        /* ---- ENCRYPTION ---- */
        if (data.intro?.encryption_blurb) {
          const encEl = document.getElementById('encryption');
          encEl.innerHTML = `<h2>🔐 Encryption, Explained Simply</h2><p>${data.intro.encryption_blurb}</p>`;
          encEl.classList.remove('hidden');
        }

        /* ---- FILTER BAR ---- */
        document.getElementById('filter-bar').classList.remove('hidden');

        /* ---- CATEGORIES ---- */
        const catEl = document.getElementById('categories');
        data.categories.forEach(cat => {
          const groupsHtml = cat.groups.map(g => {
            const tools = g.tools.map(t =>
              `<li><a href="${t.url}" target="_blank" rel="noopener noreferrer"><strong>${t.name}</strong></a><span>${t.note || ''}</span></li>`
            ).join('');
            const replaces = g.replaces?.length
              ? `<p class="replaces">↳ Replaces: ${g.replaces.join(', ')}</p>`
              : '';
            const useCase = g.use_case
              ? `<p class="use-case">💡 ${g.use_case}</p>`
              : '';
            const quickWin = g.quick_win
              ? `<p class="quick-win">✅ <strong>Quick win:</strong> ${g.quick_win}</p>`
              : '';
            const groupLabel = g.label ? `<h3 class="group-label">${g.label}</h3>` : '';
            return `<div class="tool-group">${groupLabel}${replaces}${useCase}${quickWin}<ul class="tools">${tools}</ul></div>`;
          }).join('');

          const section = document.createElement('section');
          section.className = 'category';
          section.dataset.difficulty = cat.difficulty || 'easy';
          section.id = cat.id;
          section.innerHTML = `
            <div class="cat-header">
              <span class="cat-emoji">${cat.emoji || '📍'}</span>
              <div>
                <h2>${cat.label}</h2>
                <p class="cat-tagline">${cat.tagline || ''}</p>
              </div>
              <span class="difficulty-badge diff-${cat.difficulty || 'easy'}">${cat.difficulty || 'easy'}</span>
            </div>
            ${groupsHtml}
          `;
          catEl.appendChild(section);
        });

        /* ---- FILTER LOGIC ---- */
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filter = btn.dataset.filter;
            document.querySelectorAll('.category').forEach(cat => {
              cat.style.display = (filter === 'all' || cat.dataset.difficulty === filter) ? '' : 'none';
            });
          });
        });

        /* ---- READING LIST ---- */
        const readEl = document.getElementById('reading-list');
        if (data.reading_list?.length) {
          readEl.classList.remove('hidden');
          const books = data.reading_list.map(b =>
            `<li>
              <div class="book-info">
                <span class="book-title">${b.title}</span>
                <span class="book-author">${b.author}</span>
              </div>
              ${b.why ? `<span class="book-why">${b.why}</span>` : ''}
            </li>`
          ).join('');
          readEl.innerHTML = `
            <h2>📚 Reading List</h2>
            <p class="cat-tagline">Books to sharpen your thinking on privacy, freedom, and digital sovereignty.</p>
            <ul class="book-list">${books}</ul>
          `;
        }

        /* ---- RESOURCES ---- */
        const resEl = document.getElementById('resources');
        if (data.resources) {
          resEl.classList.remove('hidden');
          let html = '<h2>🔗 Dive Deeper</h2><p class="cat-tagline">Curated links, articles, and courses to level up your privacy game.</p>';

          const sections = [
            { key: 'curated_lists', title: 'Directories & Lists' },
            { key: 'articles', title: 'Articles & Blog Posts' },
            { key: 'tools', title: 'Utility Tools' },
            { key: 'courses', title: 'Courses' }
          ];

          sections.forEach(sec => {
            const items = data.resources[sec.key];
            if (items?.length) {
              html += `<h3>${sec.title}</h3><ul class="resource-list">`;
              items.forEach(r => {
                html += `<li><a href="${r.url}" target="_blank" rel="noopener noreferrer"><strong>${r.name}</strong></a><span>${r.note || r.source || ''}</span></li>`;
              });
              html += '</ul>';
            }
          });

          resEl.innerHTML = html;
        }
      })
      .catch(err => {
        document.getElementById('categories').innerHTML =
          '<p class="error">⚠️ Failed to load data. If viewing locally, run <code>python3 -m http.server</code> from the repo root and open <code>http://localhost:8000/web/</code></p>';
      });
  </script>
</body>
</html>
