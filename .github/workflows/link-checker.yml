name: Link Checker

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly: every Sunday at midnight UTC
  pull_request:
    paths:
      - 'src/data/tools.json'

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lychee
        run: cargo install lychee
      - name: Check links in tools.json
        run: lychee --verbose src/data/tools.json web/index.html
